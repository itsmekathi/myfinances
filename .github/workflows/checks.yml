# Reusable checks, called by deploy-staging.yml and deploy-production.yml:
# branch name, build, typecheck, API e2e tests (Jest) and the Playwright suites
# against a local API + web app (results in the job summary and a playwright-* artifact).
#
# With `run: false` (a docs-only push, decided by changes.yml) only the branch-name check
# runs. The job itself always runs, so the required `checks / checks` status still reports.
name: Checks

on:
  workflow_call:
    inputs:
      run:
        description: Run build, typecheck and tests (false for docs-only changes).
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The e2e setup appends _test to the database name and creates it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myfinances?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # main, or feature/<name>: lowercase letters, digits and hyphens,
          # e.g. feature/42, feature/add-budgets, feature/42-add-budgets
          if [ "$BRANCH" = "main" ] || echo "$BRANCH" | grep -Eq '^feature/[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "Branch name OK: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' does not match feature/<name-or-issue-number> (lowercase letters, digits, hyphens). Rename it: git branch -m feature/<name>"
            exit 1
          fi
      - name: Docs-only change
        if: ${{ !inputs.run }}
        run: echo "Only documentation changed since the last successful run; skipping build and tests." >> "$GITHUB_STEP_SUMMARY"
      - if: inputs.run
        uses: actions/checkout@v7
      - if: inputs.run
        uses: pnpm/setup@v3
        with:
          # Installs pnpm only (version from package.json packageManager); install runs below.
          install: false
      - if: inputs.run
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: inputs.run
        run: pnpm install --frozen-lockfile
      - if: inputs.run
        run: pnpm build
      - if: inputs.run
        run: pnpm typecheck
      - if: inputs.run
        run: pnpm test:e2e
      - if: inputs.run
        name: Create the Playwright database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE myfinances_e2e'
      # Playwright starts the built API (after migrate deploy) and `vite preview`.
      - if: inputs.run
        uses: ./.github/actions/playwright
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myfinances_e2e?schema=public
        with:
          target: local
          suite: all
