# Keeps the production API (Render free tier) awake during waking hours, so the
# first visit doesn't wait ~1 minute for a cold start.
#
# Why a window, not 24/7: Render gives 750 free instance hours per month, shared by
# every free service in the workspace (production + staging). If they run out, ALL
# free services, production included, are suspended until next month. 24/7 would use
# ~744 h; this window (00:03-18:58 UTC = ~05:33-00:28 IST) uses ~597 h, leaving ~150 h
# for staging. Render sleeps after 15 min idle, so the service sleeps overnight.
#
# Every 5 minutes because GitHub can delay scheduled runs; starting at minute 3 avoids
# the busy top of the hour. Pings /api/health/live, which doesn't query the database,
# so Neon's compute can still suspend when idle.
#
# No `environment:` on purpose: production requires reviewer approval, which would
# block every ping. The URL is public anyway (apps/web/vercel.json).
# Note: GitHub pauses scheduled workflows after 60 days without repo activity.
name: Keep API awake

on:
  schedule:
    - cron: '3-58/5 0-18 * * *'
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping production API
        # Retries cover a cold start (~1 min) and short blips, so a failure means
        # something is actually wrong.
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 https://myfinances-api-0km5.onrender.com/api/health/live
