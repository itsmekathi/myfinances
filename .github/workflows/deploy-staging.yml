# Every branch except main: checks, then deploys to staging
# (Render staging API, Vercel preview, Neon `staging` branch).
# Branch names other than feature/<name> fail the checks. GitHub also blocks
# creating them via the "Branch naming" ruleset (.github/rulesets/branch-naming.json).
# Deploy steps are skipped (with a warning) until their secrets are configured.
# Production lives in deploy-production.yml. Setup: deployment/setup-guide.md
name: Deploy staging

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/myfinances-api

jobs:
  # "Run workflow" on main would otherwise go green while every deploy job is skipped.
  branch-guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Deploy staging only deploys feature/* branches. Pick one under \"Use workflow from\"."
          exit 1

  checks:
    uses: ./.github/workflows/checks.yml

  api:
    name: api (staging)
    # Guards a manual run on main from deploying main to staging.
    if: github.ref != 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    outputs:
      # true once the Render deploy hook was called; gates the e2e job.
      deployed: ${{ steps.render.outputs.deployed }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=long,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reported by /api/health/live; the e2e job waits for it.
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Render
        id: render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMG: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK is not set for staging; skipping the Render deploy."
            exit 0
          fi
          img=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$IMG")
          curl -fsS -X POST "$HOOK&imgURL=$img" > /dev/null
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "Render deploy triggered for \`$IMG\`" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: web (preview)
    # Runs alongside api (both after checks) so that, with required reviewers on the
    # environment, one approval releases both jobs. The Render hook only triggers a
    # deploy and doesn't wait for it, so ordering after api guaranteed nothing anyway.
    if: github.ref != 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      API_URL: ${{ secrets.API_URL }}
    steps:
      - name: Check Vercel secrets
        id: guard
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets are not set; skipping the frontend deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v7
      - if: steps.guard.outputs.enabled == 'true'
        uses: pnpm/setup@v3
        with:
          # Installs pnpm only (version from package.json packageManager); install runs below.
          install: false
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Point /api at the staging API
        if: steps.guard.outputs.enabled == 'true'
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL is not set for staging."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const file = "apps/web/vercel.json";
            const cfg = JSON.parse(fs.readFileSync(file, "utf8"));
            const api = process.env.API_URL.replace(/\/+$/, "");
            cfg.routes.find((r) => r.src === "/api/(.*)").dest = `${api}/api/$1`;
            fs.writeFileSync(file, JSON.stringify(cfg, null, 2));
          '
      - name: Build and deploy to Vercel (preview)
        id: deploy
        if: steps.guard.outputs.enabled == 'true'
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      # Gives staging one fixed URL (the latest feature-branch preview), so it can be
      # used as the staging WEB_ORIGIN and as a Google OAuth origin.
      # Set the STAGING_WEB_DOMAIN variable on the staging environment to enable it.
      - name: Point the staging domain at this preview
        if: steps.guard.outputs.enabled == 'true' && vars.STAGING_WEB_DOMAIN != ''
        env:
          DOMAIN: ${{ vars.STAGING_WEB_DOMAIN }}
          URL: ${{ steps.deploy.outputs.url }}
        # Calls the REST API instead of `vercel alias set`: the CLI looks up the token's
        # user, which fails with "User not found" for a team-scoped token.
        run: |
          host="${URL#https://}"
          case "$VERCEL_ORG_ID" in team_*) q="?teamId=$VERCEL_ORG_ID" ;; *) q="" ;; esac
          body=$(node -e 'process.stdout.write(JSON.stringify({ alias: process.argv[1] }))' "$DOMAIN")
          status=$(curl -sS -o alias.json -w '%{http_code}' -X POST             "https://api.vercel.com/v2/deployments/$host/aliases$q"             -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json"             -d "$body")
          if [ "$status" -ge 300 ]; then
            echo "::error::Vercel alias failed (HTTP $status): $(cat alias.json)"
            exit 1
          fi
          echo "Staging: https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"

  # Playwright suites against the new deployment. Waits until the API serves this commit
  # (the Render hook returns before the deploy is live). Skipped when nothing was deployed.
  e2e:
    name: e2e (staging)
    needs: [api, web]
    if: needs.api.outputs.deployed == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      target: staging
      suite: all
      expected-sha: ${{ github.sha }}
    secrets: inherit
